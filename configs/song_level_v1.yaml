  - 17
  - 42
  - 93
  ridge_alphas:
  - 0.1
  - 1
  - 10
  - 100
  hidden_sizes:
  - 16
  - 32
  l2_values:
  - 0.001
  - 0.01
  learning_rate: 0.003
  epochs: 500
  patience: 40
  min_delta: 1.0e-05
